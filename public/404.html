<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#26211A">
<title>Página no encontrada · J97</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
  :root{--bg:#F4EFE3;--ink:#2B251C;--muted:#6f6450;--gold:#C29A2E;--dark:#26211A}
  @media (prefers-color-scheme:dark){:root{--bg:#1E1A14;--ink:#F4EFE3;--muted:#cdbf98}}
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);
    font-family:'Montserrat','Segoe UI',system-ui,-apple-system,sans-serif;text-align:center}
  main{max-width:420px}
  .mark{width:72px;height:72px;margin:0 auto 20px;border-radius:20px;background:var(--dark) url('/favicon-32.png') center/44px no-repeat}
  .code{font-size:64px;font-weight:800;line-height:1;background:linear-gradient(135deg,#D8B45E,#C9A03A 55%,#B88A2A);-webkit-background-clip:text;background-clip:text;color:transparent}
  h1{font-size:22px;margin:12px 0 8px}
  p{color:var(--muted);line-height:1.5;margin-bottom:24px}
  a{display:inline-block;padding:13px 26px;border-radius:12px;background:linear-gradient(135deg,#D8B45E,#C9A03A 55%,#B88A2A);color:#2B251C;font-weight:700;text-decoration:none;box-shadow:0 2px 0 #8A6A1F}
  a:focus-visible{outline:3px solid #FFC81E;outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"></div>
  <div class="code">404</div>
  <h1>Esta página no existe</h1>
  <p>Es posible que la dirección esté mal escrita o que ya no esté disponible.</p>
  <a href="/">Volver al inicio</a>
</main>
</body>
</html>
